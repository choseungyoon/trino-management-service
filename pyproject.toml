[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tms"
version = "0.1.0"
description = "Trino Management Service - operational console for OSS Trino"
readme = "README.md"
# Python 3.9 is the floor: several target hosts still ship 3.9.
# Do not use 3.10+ syntax (no `X | Y` unions, no `match`).
requires-python = ">=3.9"

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
]
# Jinja2, MarkupSafe and python-multipart were dropped on 2026-08-27 with the
# server-rendered console (D-016). Nothing renders a template or parses a form
# any more - the console is a static bundle and every write is JSON.

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
# Only the browser tests and the screenshot script need this, and it downloads
# a Chromium. Kept out of `dev` so the ordinary test run stays installable on a
# locked-down network.
browser = [
    "playwright>=1.44",
]

[project.scripts]
tms-api = "tms.api.main:run"
tms-collector = "tms.collector.main:run"
# Validate a deployment before restarting it. See DECISIONS.md D-008.
tms-config-check = "tms.core.configcheck:run"
# Write the work board out as docs/WORK_BOARD.md so it can be committed and
# read from outside the network the board lives in. See tms/work/export.py.
tms-work-export = "tms.work.export:run"

[tool.setuptools.packages.find]
where = ["src"]

# The console is served from files, not from Python. Without this they are
# simply absent from the wheel and tms-api dies at startup with
# "Directory 'tms/ui/assets/static' does not exist" - which never shows up in
# development, because that runs straight from src/ on sys.path.
#
# Committed rather than built at install time: the deployment host has no Node
# on it (DECISIONS.md D-016), so anything absent from the repository is absent
# from the server.
[tool.setuptools.package-data]
"tms.ui" = ["assets/*", "assets/static/*"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# UP006/UP007 would rewrite typing.List / Optional into 3.10+ syntax.
ignore = ["UP006", "UP007", "UP035"]

[tool.pytest.ini_options]
testpaths = ["tests"]
