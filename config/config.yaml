# TMS configuration - non-secret values only.
#
# This file is tracked in git and the repository is PUBLIC (DECISIONS.md D-002).
# Never put credentials, real hostnames, or internal IPs here.
# Secrets belong in config.secret.yaml (gitignored) or the environment.

clusters:
  # Gateway is disabled for now (B6), so this list is the source of truth for
  # which clusters exist. See ARCHITECTURE.md 6-3-2.
  - name: prod-a
    coordinator_url: https://trino-a-coordinator.example.internal:8443
    expected_workers: 12
    trino_ui_url: https://trino-a-coordinator.example.internal:8443/ui/
    # This cluster's `node.environment`, copied from the COORDINATOR's
    # node.properties. Trino's db resource group manager scopes every row by
    # it, so it is how TMS asks "is this cluster's configuration loaded" before
    # restarting it (D-010). Only needed when resource_groups.enabled is true;
    # a cluster without it is skipped by that check rather than blocked.
    node_environment: cluster1
  - name: prod-b
    coordinator_url: https://trino-b-coordinator.example.internal:8443
    expected_workers: 12
    trino_ui_url: https://trino-b-coordinator.example.internal:8443/ui/
    node_environment: cluster2

trino:
  # Basic auth service account. Password comes from config.secret.yaml or
  # TMS_TRINO_PASSWORD. TMS never sends X-Trino-User: keeping the authenticated
  # user equal to the session user avoids the impersonation check entirely
  # (TRINO_VERIFIED.md T3-5).
  user: tms-svc
  verify_tls: true
  connect_timeout_seconds: 2
  read_timeout_seconds: 5
  write_timeout_seconds: 10
  # Reads are retried, writes never are: a retried kill can kill twice.
  read_retries: 2
  circuit_breaker_failures: 5
  circuit_breaker_reset_seconds: 30

collector:
  query_poll_interval_seconds: 5
  jmx_poll_interval_seconds: 15
  info_poll_interval_seconds: 30
  # Snapshots older than this are surfaced as stale and every health test is
  # downgraded to UNKNOWN. Never show stale data as current.
  stale_threshold_seconds: 30
  # SQL text stored in the list snapshot is truncated here. Full text is fetched
  # on demand from GET /v1/query/{queryId}.
  query_text_max_bytes: 4096
  # Measured 2026-08-06: ~3.5 KB per running query. 1,000 concurrent queries is
  # therefore ~3.5 MB per poll. Peak concurrency is still unknown
  # (WORKLOAD_PROFILE.md W2), so back off automatically instead of guessing.
  response_backoff_bytes: 5000000
  response_backoff_interval_seconds: 10

trino_facts:
  # CoordinatorNodeManager.ActiveNodeCount includes the coordinator.
  # Verified 2026-08-06: a 12-worker cluster reports 13.
  # Kept as configuration rather than a magic number so a version change is a
  # one-line fix. See TRINO_VERIFIED.md T1-7-1.
  coordinator_counted_in_active_nodes: true

gateway:
  # B6 is resolved (version 19 confirmed). Enable once the Gateway has an
  # `API` role account for TMS — see runbooks/gateway-config-request.md.
  #
  # While disabled, health test H-08 is removed from the catalogue entirely
  # rather than reported as permanently UNKNOWN, and the Gateway nav link is
  # hidden rather than leading to a page that can only say "off".
  enabled: false
  base_url: ""
  user: ""
  # Password comes from TMS_GATEWAY_PASSWORD or config.secret.yaml.
  # ⚠️ Gateway has no read-only role: the `API` role that lists backends can
  # also change them. Protect this like the Trino credential.
  poll_interval_seconds: 30

workload:
  # FR-WORKLOAD — resource group tree from JMX.
  #
  # Off by default on purpose. Collection costs one JMX registry enumeration
  # plus one read per exported group on every poll, and NFR-PERF-03 has only
  # ever been measured on a laptop against an idle single node — a figure that
  # measurement itself records as a lower bound. Turn this on after the
  # production measurement in PERF_MEASUREMENT.md §6-1.
  #
  # Also requires "jmxExport": true on every group in resource-groups.json;
  # groups without it are invisible to TMS (TRINO_VERIFIED.md §T1-4).
  enabled: false
  poll_interval_seconds: 15

resource_groups:
  # D-010 — Trino's `db` resource group manager tables. NOT the same thing as
  # `workload` above, and the two are independent:
  #
  #   workload         reads JMX MBeans   -> what each group is doing right now
  #   resource_groups  reads the database -> what groups are configured at all
  #
  # This one is not a screen. It exists because a Trino 477 coordinator using
  # the db manager exits at startup if it cannot read that store - it does not
  # come up degraded (TRINO_VERIFIED.md T1-4-1). So before the safe sequence
  # stops a cluster, TMS asks whether that cluster could start again, and
  # refuses the step when the answer is no. A cluster stopped with its traffic
  # already blocked and nothing able to restart it is the worst outcome the
  # sequence can produce.
  #
  # Leave this off while Trino still uses the `file` manager. Off means TMS
  # makes no claim either way - it does not mean the store was checked and
  # found healthy.
  enabled: false
  # Must match `?currentSchema=` in the coordinator's
  # resource-groups.config-db-url. The tables live in the TMS database but in
  # their own schema, so a TMS migration has no path to the rows Trino reads to
  # decide whether to admit a query.
  schema: trino_resource_groups
  # Does the coordinator have etc/group-provider.properties? TMS cannot see
  # that file, and the consequence of getting it wrong is quiet: without a
  # provider Trino always passes empty groups, so a `user_group_regex` selector
  # never matches anything. Left false, the editor warns whenever one is used.
  group_provider_configured: false

benchmark:
  # FR-BM-01/03/04 — the performance harness.
  #
  # ⛔ FR-BM-04 is non-negotiable, and it shapes how this feature behaves more
  # than any setting here: TMS refuses to run against a cluster that is still
  # in rotation, and it will NOT take the cluster out of rotation for you.
  # Excluding a cluster is step 1 of the safe restart sequence and nothing
  # else - a "run benchmark" button that could deactivate a backend would be a
  # way around CLAUDE.md rule 5 with a different label on it.
  #
  # That means the guard needs the Gateway integration. With `gateway.enabled`
  # false, every run is refused, because TMS cannot tell whether the cluster is
  # taking production traffic and an unknown routing state is not an excluded
  # one.
  enabled: false

  # How many times each query runs. The first execution of a query is not like
  # the rest, and the comparison uses the median - one repetition means the
  # median is the cold start.
  default_repetitions: 3
  max_repetitions: 20

  # Per statement. Much larger than the SQL client's 30s default on purpose: a
  # benchmark query that takes four minutes is the finding, not a failure.
  timeout_seconds: 600
  # A gap between statements, so the cluster is not measured while it is still
  # finishing the previous one.
  pause_seconds: 1

  # ⛔ Query sets are NOT here. They were until FR-BM-06; they now live in the
  # database and an administrator edits them at /benchmarks/sets, so a new
  # query does not need a deploy. `benchmark.query_sets` in this file is
  # REFUSED at startup rather than ignored - a set left behind here would be a
  # second source for the same thing, and the console's copy would win
  # silently. See DECISIONS.md D-014.
  #
  # What did not change: statements must be READ-ONLY (SELECT / WITH / SHOW /
  # EXPLAIN / DESCRIBE / VALUES / TABLE) and a single statement each. Not
  # because a write benchmark is illegitimate, but because these run N times
  # unattended against a cluster whose defining property at that moment is
  # that nobody is watching it. Checked when the query is saved, and again
  # immediately before each execution.

fleet:
  # FR-FL-01 / FR-FL-03 — node inventory and graceful shutdown.
  #
  # ⛔ Measured on Trino 477 (TRINO_VERIFIED.md T1-2-1), correcting two
  # assumptions in REQUIREMENTS:
  #   * `GET /v1/node` does not exist — it 404s.
  #   * `system.runtime.nodes` needs the ExecuteQuery permission, which TMS
  #     does not have and should not be given for one field.
  #
  # So TMS takes the node list from the Ansible inventory and asks each node
  # about itself through `GET /v1/info`, which is PUBLIC — no credentials are
  # sent to workers on any poll.
  #
  # The cost of that: TMS cannot say *which* worker failed to join discovery
  # (FR-FL-02). It shows the coordinator's node counts as a cross-check and
  # says so on the screen rather than leaving a gap to be misread.
  enabled: false

  # Node membership changes on the timescale of a deployment, not a query, and
  # each poll fans out to every node. Slow on purpose.
  poll_interval_seconds: 60

  # Usually the same files as cluster_ops.ansible.inventories. Kept separate so
  # that seeing the fleet does not require permission to restart it.
  inventories: {}
  #   prod-a: /etc/tms/ansible/cluster1.ini
  #   prod-b: /etc/tms/ansible/cluster2.ini

  # An inventory carries addresses, not schemes or ports. Assuming one would
  # make every node look unreachable on a cluster that disagreed — which reads
  # as an outage rather than a typo — so this is required when enabled.
  node_url_template: ""      # e.g. "https://{address}:8443"

  # A worker takes at least 2 x shutdown.grace-period plus its running tasks to
  # exit (four minutes on Trino's defaults). A shorter deadline times out on a
  # perfectly healthy shutdown.
  shutdown_timeout_seconds: 900

  # FR-FL-04/05 — playbooks TMS may run on request. Empty by default, and empty
  # means the panel does not appear: this uses the TMS host's SSH access to
  # every node, the same reach D-009 weighed, so it exists only where an
  # administrator has said what may be run.
  #
  # ⛔ Never point one of these at a playbook that restarts anything. TMS reads
  # a path and an exit code; it cannot know whether a cluster was drained
  # first, so a restart declared here is a button that restarts without
  # stopping traffic — the path CLAUDE.md rule 5 closes. tms-config-check
  # refuses that exact case.
  #
  # Parameters are integers only, with bounds. A scale-out that cannot say
  # "how many" is not much use, but a string parameter would hand the request a
  # way onto the command line. An integer cannot be anything but an integer.
  jobs: {}
  #   scale_out:
  #     title: Add workers
  #     description: Provisions new worker VMs and joins them to the cluster.
  #     playbook: /etc/tms/ansible/scale-out.yml
  #     timeout_seconds: 3600
  #     parameters:
  #       count:
  #         label: Workers to add
  #         min: 1
  #         max: 4
  #         default: 2

cluster_ops:
  # FR-CO-02 — the safe restart sequence.
  #
  # The sequence itself is always available (given the Gateway): deactivate →
  # confirm intake stopped → drain → restart → confirm health → reactivate,
  # with no path that skips a step. This setting only decides *who performs
  # step 4*.
  #
  #   manual   TMS stops and asks the operator to restart the cluster, then
  #            waits until they say it is done AND health confirms it. No new
  #            credentials, no new reach. This is a complete implementation of
  #            the step, not a lesser one — the part that prevents the incident
  #            is the gate, and the gate is identical either way.
  #
  #   ansible  TMS runs `ansible-playbook` itself, from the TMS host.
  #
  # ⛔ `ansible` is a security decision, not a convenience one. It means the
  # TMS host holds SSH access to every Trino node, so every future TMS
  # vulnerability inherits that reach. The platform team was shown the
  # trade-off against a job-runner API (AWX/AAP, where TMS would hold a token
  # scoped to one job template) and chose direct execution — DECISIONS.md D-008.
  # Do not switch this on because Ansible happens to be installed.
  restart_mode: manual

  # How long the whole drain may take before the UI stops implying patience.
  drain_timeout_seconds: 900

  ansible:
    # Absolute paths, checked at startup. Nothing a user types can select,
    # alter or add a playbook: the cluster name only picks which of the
    # inventories below is passed with --inventory, and never reaches the
    # command line itself.
    playbook: ""
    binary: ansible-playbook
    timeout_seconds: 1800
    # Writable HOME for the playbook run, and the home of the known_hosts file
    # TMS points SSH at. Must equal `StateDirectory=` in the systemd unit —
    # note that setting takes a NAME relative to /var/lib, not a path, so the
    # two are kept in step by hand. They disagree silently.
    state_dir: /var/lib/trino-management-service
    # One inventory per cluster, holding that cluster's coordinator and
    # workers. Every configured cluster needs an entry or startup fails —
    # discovering a missing one mid-restart would mean a cluster already taken
    # out of rotation that TMS then refuses to restart.
    inventories: {}
    #   prod-a: /etc/tms/ansible/cluster1.ini
    #   prod-b: /etc/tms/ansible/cluster2.ini

    # ⛔ The SSH private key must be named explicitly, here or in the inventory.
    # Ansible's usual fallback of "whatever is in ~/.ssh" does not apply: the
    # unit runs with ProtectHome=true, and OpenSSH resolves `~` from the passwd
    # entry rather than from $HOME, so the service account's real home is both
    # unreachable and not where TMS put anything. With no key named, every host
    # fails with `Permission denied (publickey)`.
    extra_vars: {}
    #   ansible_ssh_private_key_file: /etc/tms/ssh/trino-nodes.pem

health:
  # Consecutive polls a test must hold a state before the transition is
  # recorded. Stops a single spike from generating an event.
  stabilization_polls: 3
  thresholds:
    heap_used_pct_concerning: 80
    heap_used_pct_bad: 90
    failure_rate_pct_concerning: 5
    failure_rate_pct_bad: 20
    internal_failures_concerning: 1
    internal_failures_bad: 5
    oom_kills_concerning: 1
    oom_kills_bad: 3
    # H-03 works on unplanned missing workers; drain and shutdown are excluded.
    missing_workers_pct_bad: 20
  long_running_query_seconds: 300

deeplinks:
  # Empty values render no link at all rather than a dead one.
  log:
    template: ""
    padding_seconds: 300
  query_history:
    # The separate query-history project (DECISIONS.md D-001). This is the only
    # R1 entry point for completed queries, so fill it in as soon as known.
    query_url_template: ""
    home_url: ""
  grafana:
    cluster_dashboard: ""
  superset_url: ""

portal:
  session_idle_timeout_minutes: 30
  session_absolute_timeout_hours: 12

server:
  host: 127.0.0.1
  port: 8500
